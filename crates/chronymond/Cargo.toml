[package]
name = "chronymond"
description = "Records chronyd's tracking and source statistics into SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chronymon = { version = "0.1.0", path = "../chronymon" }
chronymon-control = { version = "0.1.0", path = "../chronymon-control" }
chronymon-log = { version = "0.1.0", path = "../chronymon-log" }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
jiff = "0.2.38"
signal-hook = "0.4.5"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }
