[package]
name = "chronymond"
description = "Records chronyd's tracking and source statistics into SQLite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
chronymon = { version = "1.2.0", path = "../chronymon" }
chronymon-control = { version = "1.2.0", path = "../chronymon-control" }
chronymon-log = { version = "1.2.0", path = "../chronymon-log" }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
glob = "0.3.4"
jiff = "0.2.38"
rustix = { version = "1.1.6", features = ["time"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }

# One package carries both programs, built from one workspace build by
# deb-workflows' rust-build-deb (packages: chronymond).
[package.metadata.deb]
name = "chronymon"
maintainer = "Christopher Hoover <ch@murgatroid.com>"
copyright = "2026, Christopher Hoover"
extended-description = """\
A daemon that records chronyd's tracking, its sources' samples and \
statistics, and what happens to chronyd and the host -- restarts, \
steps, boots, crashes -- into SQLite, and a browser view that charts \
it live.  It reads chronyd's control socket and its log files."""
section = "net"
priority = "optional"
depends = "$auto, adduser, chrony (>= 4.3)"
assets = [
    ["target/release/chronymond", "usr/bin/", "755"],
    ["target/release/chronymon-web", "usr/bin/", "755"],
    ["../../packaging/systemd/chronymond.default", "etc/default/chronymond", "644"],
    ["../../packaging/systemd/chronymon-web.default", "etc/default/chronymon-web", "644"],
    ["../../README.md", "usr/share/doc/chronymon/README.md", "644"],
]
conf-files = ["/etc/default/chronymond", "/etc/default/chronymon-web"]
maintainer-scripts = "../../packaging/debian/"
changelog = "../../packaging/debian/changelog"
# Both enabled: neither needs settings to run, and the web view serves
# this host alone until told otherwise.
systemd-units = [
    { unit-name = "chronymond", unit-scripts = "../../packaging/systemd", enable = true, start = true },
    { unit-name = "chronymon-web", unit-scripts = "../../packaging/systemd", enable = true, start = true },
]
