<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chronymon: temperature</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<link rel="stylesheet" href="/style.css">

<div class="panel" id="status"><span class="muted">connecting...</span></div>

<nav class="panel nav">
  <a href="/">Live</a>
  <a href="/sources">Sources</a>
  <a href="/refclocks">Refclocks</a>
  <a href="/temperature" aria-current="page">Temperature</a>
  <a href="/journal">Journal</a>
  <a href="/distribution">Distribution</a>
</nav>

<div class="panel">
  <div class="controls">
    <h2>Temperature, from tempcomp.log</h2>
    <span class="grow"></span>
    <span id="ranges"></span>
  </div>
  <div id="charts" class="stack"></div>
  <div id="readout"></div>
  <div id="note-tip"></div>
  <div id="note"></div>
</div>

<div class="panel">
  <h2>The clock's frequency against temperature</h2>
  <div id="scatter"></div>
  <div id="fitting" class="muted" hidden></div>
  <div id="figures" class="muted"></div>
  <div class="controls fit">
    <button id="fit" type="button" hidden>Fit tempcomp</button>
  </div>
</div>

<!-- The fit, of the range shown when it was asked for, over the page
     until closed. -->
<dialog id="fit-dialog" aria-labelledby="fit-heading">
  <div class="controls">
    <h2 id="fit-heading">tempcomp, fitted</h2>
    <span class="grow"></span>
    <button id="fit-close" type="button">Close</button>
  </div>
  <div id="fits"></div>
</dialog>

<footer id="colophon"></footer>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script src="/charts.js"></script>
<script>
"use strict";

// A day: a temperature's effect is a day's cycle.
readRange(86400);

const TEMPCOMP = "tempcomp_sample";
// The clock's frequency, from the protocol where the daemon was running
// and from tracking.log where it was not.
const FREQUENCY = { table: "tracking", columns: ["frequency"], fill: { table: "log_tracking", columns: ["frequency"] } };

// Why there may be nothing: tempcomp's readings are only in chronyd's
// log.
const NOTHING =
  "No temperature compensation is recorded: chronyd logs it only with 'tempcomp' configured and " +
  "'log tempcomp' in chrony.conf, and chronymond reads it from its log directory.";

const stack = {
  container: "charts",
  readout: "readout",
  note: "note",
  sync: haveUplot ? uPlot.sync("chronymon") : null,
  charts: [],
  marks: [],
};

let scatterChart = null;

// The scatter's frequency axis.
const OWN_FREQUENCY = "Clock's own frequency, ppm";

// The fits of the pairs the last scatter set against each other, the
// clock's own frequency against the temperature.
let fitFrom = null;

// The most compensation chronyd takes, in ppm; past it a reading is
// ignored (`chrony.conf`, tempcomp, 4.3 to 4.9).
const TEMPCOMP_LIMIT = 10;

// Significant figures of a temperature a comment gives.
const TEMPERATURE_FIGURES = 6;

// Significant figures of a fitted coefficient.
const COEFFICIENT_FIGURES = 4;

// A time as a comment in chrony.conf says it, to the minute, in UTC.
const utcMinute = (at) => new Date(at * 1000).toISOString().slice(0, 16).replace("T", " ");

// A coefficient as chrony.conf takes it.
const coefficient = (v) => String(Number(v.toPrecision(COEFFICIENT_FIGURES)));

// A polynomial's value at `x`, its coefficients `c`, constant first.
const evaluate = (c, x) => c.reduce((s, v, n) => s + v * x ** n, 0);

// The fits, linear and quadratic: each its name and color.
const FITS = [
  { name: "Linear", degree: 1, color: FIT_COLOR },
  { name: "Quadratic", degree: 2, color: CURVE_COLOR },
];

// The tempcomp lines that cancel the frequency's following the
// temperature, from the last scatter's fits, each with what it leaves of
// the frequency's spread.  The frequency is how fast the clock runs,
// positive fast, and a positive compensation runs it faster, so each
// coefficient is the fitted one negated; T0 has none, so k0 is 0.
// The lowest and highest temperatures of `pairs`.
const temperatureRange = (pairs) =>
  pairs.reduce(([lo, hi], { x }) => [Math.min(lo, x), Math.max(hi, x)], [Infinity, -Infinity]);

// The most compensation, ppm, either way, of a line k1 d + k2 d^2 over
// d from `from` to `to`, the temperature from T0: at the ends, or the
// curve's turn between them.
function mostCompensation(k1, k2, from, to) {
  const at = (d) => Math.abs(k1 * d + k2 * d * d);
  const turn = k2 === 0 ? null : -k1 / (2 * k2);
  return Math.max(at(from), at(to), turn != null && turn > from && turn < to ? at(turn) : 0);
}

function drawFits() {
  if (!fitFrom) return;
  const { pairs, t0, spread, fits } = fitFrom;
  const sensor = lastStatus?.tempcomp;
  if (!sensor) return;
  const head = `tempcomp ${sensor.sensor} ${sensor.interval}`;
  // One block to paste: what both were fitted from, the sensor too, so
  // the file says it later, then each fit, its quality in a comment
  // above it, in ASCII, as chrony.conf is.
  const [lowest, highest] = temperatureRange(pairs).map((t) => Number(t.toPrecision(TEMPERATURE_FIGURES)));
  const groups = fits.map(({ name, degree, c, left, determined }) => {
    // As the line has them, rounded.
    const [k1, k2] = [-c[1], degree === 2 ? -c[2] : 0].map((k) => Number(coefficient(k)));
    const most = mostCompensation(k1, k2, lowest - t0, highest - t0);
    return [
      `# ${name} fit: leaves ${ppm(left)} RMS of the frequency's ${ppm(spread)}` +
        (determined == null
          ? "."
          : `, R ${Math.sqrt(Math.max(determined, 0)).toFixed(4)}, R^2 ${determined.toFixed(4)}.`),
      ...(most > TEMPCOMP_LIMIT
        ? [`# Compensates up to ${ppm(most)}, past chronyd's ${TEMPCOMP_LIMIT} ppm: readings past it are ignored.`]
        : []),
      `${head} ${t0} 0 ${coefficient(k1)} ${coefficient(k2)}`,
    ].join("\n");
  });
  const common = [
    `# Fitted by chronymon from ${fitFrom.count} points, ` +
      `${utcMinute(pairs[0].at)} to ${utcMinute(pairs[pairs.length - 1].at)} UTC,`,
    `# of ${sensor.sensor}, robust (Huber) least squares, at ${lowest} to ${highest}:`,
    `# outside them, the lines are a guess.`,
    ...(fitFrom.settling > 0
      ? [`# ${fitFrom.settling} of the points within an hour of chronyd starting, its estimate settling.`]
      : []),
  ].join("\n");
  // What was fitted, as text, its comment marks the copy's alone; then
  // each fit, the block to paste, its Copy in its corner, which copies
  // it with the comment.
  fitCopies = groups.map((group) => `${common}\n\n${group}`);
  const said = common.split("\n").map((line) => line.replace(/^# /, "")).join("\n");
  showHtml($("fits"), `<pre class="fitted">${esc(said)}</pre>` +
    groups.map((group, n) => `<div class="fit"><pre class="tempcomp">${esc(group)}</pre>` +
      `<button type="button" data-copy="${n}">Copy</button></div>`).join(""));
}

// What each fit's Copy copies.
let fitCopies = [];

// The scatter of the clock's own frequency against the temperature,
// and its fits, as `/api/tempcomp/fit` gives them: `got`.
function drawScatter(got) {
  scatterChart?.destroy();
  scatterChart = null;
  $("scatter").innerHTML = "";
  fitFrom = null;
  $("fit").hidden = true;
  const fitted = got.fitted;
  const cut = got.since != null ? local(got.since) : null;
  if (!fitted) {
    showHtml($("figures"), "too few readings of both in this range to set against each other" +
      (cut ? `: those before ${cut} are left out, when chronymond first read this sensor, or it changed, ` +
        "and they may be another sensor's" : ""));
    return;
  }
  const { at, x, y } = fitted.pairs;
  const pairs = at.map((t, i) => ({ at: t, x: x[i], y: y[i] }));
  const fits = fitted.fits.map((f) => ({
    ...FITS.find((d) => d.degree === f.degree),
    ...f,
    value: (v) => evaluate(f.c, v - fitted.t0),
  }));
  fitFrom = { pairs, count: fitted.count, t0: fitted.t0, spread: fitted.spread, fits, settling: fitted.settling };
  scatterChart = scatter(
    $("scatter"),
    pairs,
    { name: columnName(key(TEMPCOMP, "temperature")) },
    { name: OWN_FREQUENCY },
    $("scatter").clientWidth || 800,
    fits,
  );
  // Only for a tempcomp line chronymond read, which the fit replaces,
  // and a fit to give.
  $("fit").hidden = !lastStatus?.tempcomp || fits.length === 0;
  // Each fit on its own line, its name in its color, the scatter's
  // legend, with its R and R^2, the line's slope too, and since when,
  // if not the whole range.
  const named = fits.map((f) => {
    const figures = [
      ...(f.degree === 1 ? [`${f.c[1].toPrecision(3)} ppm per unit of temperature`] : []),
      ...(f.determined == null
        ? []
        : [`R ${Math.sqrt(Math.max(f.determined, 0)).toFixed(3)}`, `R² ${f.determined.toFixed(3)}`]),
    ];
    return `<span style="color:${f.color}">${f.name}</span>: ${figures.join(", ")}`;
  });
  // Those not fitted, and why.
  const unnamed = fitted.unfitted.map((u) => {
    const { name } = FITS.find((d) => d.degree === u.degree);
    return `${name}: not fitted, ` + (u.why === "narrow"
      ? `the temperatures fill only ${u.filled} of ${u.of} stretches of their range`
      : "too few distinct temperatures to determine it");
  });
  const sinceChange = cut ? ` since ${cut}, when chronymond first read this sensor, or it changed` : "";
  showHtml($("figures"),
    `${fitted.count.toLocaleString()} clock updates` +
    (got.stride > 1 ? `, one in ${got.stride} drawn` : "") +
    `, robust least squares${sinceChange}:<br>${[...named, ...unnamed].join("<br>")}` +
    (fitted.settling > 0
      ? `<br>${fitted.settling.toLocaleString()} of them within an hour of chronyd starting, its estimate settling.`
      : ""));
}

// The scatter, its caption and its fit gone: none of another range's
// readings left to fit from.  An open dialog stays, its text its own
// range's, through a passing failure to read.
function clearScatter() {
  scatterChart?.destroy();
  scatterChart = null;
  $("scatter").innerHTML = "";
  showHtml($("figures"), "");
  fitFrom = null;
  $("fit").hidden = true;
  scatterRange = null;
}

// How long the fit may take, in ms, before the page says it is fitting.
const WORKING_AFTER = 500;
// The range the scatter was drawn for, as `range` gives it; null with
// none drawn.  A read of the same range, on the refresh timer, keeps it
// as it is until the new fit replaces it.
let scatterRange = null;
const rangeKey = () => JSON.stringify(range);

// Say what the page is doing in place of the scatter; null, nothing.
function working(what) {
  if (what) $("fitting").textContent = what;
  $("fitting").hidden = !what;
}

// The old range's scatter and caption, dimmed or not: they stand until
// the new range's fit replaces them, which on a slow host is seconds.
function dimScatter(dim) {
  $("scatter").classList.toggle("dim", dim);
  $("figures").classList.toggle("dim", dim);
}

async function load(signal) {
  // Another range: what is shown is not it, said at once.
  const moved = scatterRange !== null && scatterRange !== rangeKey();
  if (moved) {
    dimScatter(true);
    working("Reading this range\u2026");
  }
  try {
    await readAndDraw(signal, moved);
  } finally {
    dimScatter(false);
    working(null);
  }
}

async function readAndDraw(signal, moved) {
  // The status says which tempcomp line the fit replaces; read here if
  // the strip has not yet.
  lastStatus ??= await ask("/api/status", signal);
  // Whether there are any at all, from the table's extent.
  const probe = await ask(`/api/history?table=${TEMPCOMP}&columns=temperature&points=16`, signal);
  if (probe.first == null) {
    clearStack(stack, NOTHING);
    clearScatter();
    return;
  }
  if (!haveUplot) {
    clearStack(stack, NO_UPLOT);
    clearScatter();
    return;
  }
  const { from, to } = rangeBounds();
  const events = await eventsFor(signal, from, to);
  stack.marks = events.marks;
  const temperature = await readHistory(signal, TEMPCOMP, ["temperature", "compensation"]);
  // On the temperature's grid, so the two pair by bucket.
  const frequency = await readHistory(signal, FREQUENCY.table, FREQUENCY.columns, null, FREQUENCY.fill,
    boundsOf(temperature));
  const drawn = [
    ...chartsOf(TEMPCOMP, temperature.plots).map((d) => ({ ...d, x: temperature.at })),
    ...filledCharts("tracking", frequency, { frequency: "frequency" }).map((d) => ({ ...d, x: frequency.at })),
  ];
  drawStack(stack, { x: [], span: spanOf([temperature, frequency]), drawn }, "no temperature readings in this range");
  // The fit reads every update in the range, a scan as long as the
  // history's, so it waits as long; and says it is working, if it is
  // slow enough to notice, over the scatter it will replace.
  const fitting = () => working("Fitting every clock update in this range\u2026");
  if (moved) fitting();
  const slow = setTimeout(fitting, WORKING_AFTER);
  try {
    drawScatter(await ask(`/api/tempcomp/fit?from=${temperature.from}&to=${temperature.to}`, signal,
      HISTORY_TIMEOUT));
  } finally {
    clearTimeout(slow);
  }
  scatterRange = rangeKey();
}

// How long Copy says it copied, in ms.
const COPIED_FOR = 1500;

$("fit").addEventListener("click", () => {
  drawFits();
  $("fit-dialog").showModal();
});
$("fit-close").addEventListener("click", () => $("fit-dialog").close());
// A click on the backdrop, outside the dialog's box, closes it: one
// begun outside too, so a selection dragged out of the box does not.
const outsideFit = (e) => {
  const box = $("fit-dialog").getBoundingClientRect();
  return e.clientX < box.left || e.clientX > box.right || e.clientY < box.top || e.clientY > box.bottom;
};
let pressedOutside = false;
$("fit-dialog").addEventListener("pointerdown", (e) => { pressedOutside = outsideFit(e); });
$("fit-dialog").addEventListener("click", (e) => {
  if (pressedOutside && outsideFit(e)) $("fit-dialog").close();
});
// Copied by the clipboard, there only to a page served over HTTPS or
// from localhost; else by the browser's copy command, from the text put
// in a hidden box and selected, which works over plain HTTP from a
// click; else the fit's block is left selected, to copy by hand.  The
// button says which.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const box = document.createElement("textarea");
    box.value = text;
    box.setAttribute("readonly", "");
    box.style.cssText = "position: fixed; top: 0; left: 0; opacity: 0";
    $("fit-dialog").append(box);
    box.select();
    const copied = document.execCommand("copy");
    box.remove();
    return copied;
  }
}

$("fits").addEventListener("click", async (e) => {
  const button = e.target.closest("button[data-copy]");
  if (!button) return;
  const copied = await copyText(fitCopies[Number(button.dataset.copy)]);
  if (!copied) getSelection().selectAllChildren(button.previousElementSibling);
  button.textContent = copied ? "Copied" : "Select and copy";
  setTimeout(() => { button.textContent = "Copy"; }, COPIED_FOR);
});
rangeControl($("ranges"), soon);
addEventListener("resize", soon);
content({
  floor: 30,
  clear(why) {
    clearStack(stack, why);
    clearScatter();
  },
  load,
});
</script>
