<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script src="/charts.js"></script>
<script>
"use strict";

// A day: a temperature's effect is a day's cycle.
readRange(86400);

const TEMPCOMP = "tempcomp_sample";
// The clock's frequency, from the protocol where the daemon was running
// and from tracking.log where it was not.
const FREQUENCY = { table: "tracking", columns: ["frequency"], fill: { table: "log_tracking", columns: ["frequency"] } };

// Why there may be nothing: tempcomp's readings are only in chronyd's
// log.
const NOTHING =
  "No temperature compensation is recorded: chronyd logs it only with 'tempcomp' configured and " +
  "'log tempcomp' in chrony.conf, and chronymond reads it from its log directory.";

const stack = {
  container: "charts",
  readout: "readout",
  note: "note",
  sync: haveUplot ? uPlot.sync("chronymon") : null,
  charts: [],
  marks: [],
};

let scatterChart = null;

// The scatter's frequency axis.
const OWN_FREQUENCY = "Clock's own frequency, ppm";

// The pairs the last scatter set against each other, for the fit.
// chronyd reports its own correction of the frequency, tempcomp's
// compensation left out (`LCL_ReadAbsoluteFrequency`, `local.c`, 4.3
// to 4.9): what remains once tempcomp has corrected.  The clock's own
// frequency is that less the compensation, whatever tempcomp is set to.
let fitFrom = null;

// The most compensation chronyd takes, in ppm; past it a reading is
// ignored (`chrony.conf`, tempcomp, 4.3 to 4.9).
const TEMPCOMP_LIMIT = 10;

// Significant figures of a fitted coefficient.
const COEFFICIENT_FIGURES = 4;

// The root mean square of `values`.
const rms = (values) => Math.sqrt(values.reduce((s, v) => s + v * v, 0) / values.length);

// A time as a comment in chrony.conf says it, to the minute, in UTC.
const utcMinute = (at) => new Date(at * 1000).toISOString().slice(0, 16).replace("T", " ");

// A coefficient as chrony.conf takes it.
const coefficient = (v) => String(Number(v.toPrecision(COEFFICIENT_FIGURES)));

// Huber's constant, in robust standard deviations of the residuals:
// a residual past it counts for less, an NTP source's wander or a step
// pulling the fit less than it would least squares; on normal noise
// the fit is 95% as efficient as least squares.
const HUBER = 1.345;
// The median absolute deviation to the standard deviation, for normal
// noise.
const MAD_SIGMA = 1.4826;
// Most rounds of reweighting, and the change in the residuals' scale,
// relative, below which the weights have settled.
const ROBUST_ROUNDS = 50;
const ROBUST_SETTLED = 1e-6;

const median = (values) => {
  const sorted = [...values].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
};
const evaluate = (c, x) => c.reduce((s, v, n) => s + v * x ** n, 0);

// The robust (Huber) polynomial of `degree` through `pairs`, x from T0,
// by least squares reweighted until the weights settle: its
// coefficients, constant first, and the residuals' robust scale; or
// null.
function robustPolynomial(pairs, degree) {
  let c = polynomial(pairs, degree);
  let scale = null;
  for (let round = 0; c && round < ROBUST_ROUNDS; round++) {
    const residuals = pairs.map(({ x, y }) => y - evaluate(c, x));
    const next = MAD_SIGMA * median(residuals.map(Math.abs));
    if (!(next > 0)) return { c, scale: next };
    const settled = scale != null && Math.abs(next - scale) <= ROBUST_SETTLED * scale;
    scale = next;
    if (settled) break;
    c = polynomial(pairs.map((p, n) =>
      ({ ...p, w: Math.min(1, HUBER * scale / Math.abs(residuals[n])) })), degree);
  }
  return c && { c, scale };
}

// Lags tried, as a first-order filter's time constant in seconds:
// none, then five minutes to four hours.
const LAGS = [0, 300, 600, 1200, 1800, 3600, 5400, 7200, 10800, 14400];
// The lag is chosen by how well each predicts readings left out of its
// fit: the range in this many contiguous stretches, each left out in
// turn, and the seconds either side of it left out too, as the
// frequency's noise is slow.  Judged by its own fit, a lag takes in
// what it should not: a step of the sensor the frequency followed at
// once, smeared into a trail, fits the bulk no worse.
const LAG_FOLDS = 6;
const LAG_MARGIN = 3600;
// A lag is tried only in a range this many times as long; and the
// filter's first this many time constants, while it settles from the
// first reading, are not fitted.
const LAG_SPAN = 10;
const LAG_SETTLE = 3;

// `values` at the times `at` through a first-order filter of time
// constant `lag` seconds, as a crystal follows the air around it:
// null where the reading is.  A gap of many time constants starts it
// again from the next reading.
function lagged(at, values, lag) {
  if (lag === 0) return values;
  let filtered = null, last = null;
  return values.map((v, i) => {
    if (v == null) return null;
    filtered = filtered == null ? v : filtered + (1 - Math.exp(-(at[i] - last) / lag)) * (v - filtered);
    last = at[i];
    return filtered;
  });
}

// The RMS by which robust lines miss the frequency of `pairs`, in
// time order, left out of their fit, LAG_FOLDS stretches in turn; or
// null for too few to fit.
function heldOut(pairs) {
  const missed = [];
  for (let fold = 0; fold < LAG_FOLDS; fold++) {
    const left = pairs.slice(Math.floor(fold * pairs.length / LAG_FOLDS),
      Math.floor((fold + 1) * pairs.length / LAG_FOLDS));
    if (left.length === 0) continue;
    const from = left[0].at - LAG_MARGIN, to = left[left.length - 1].at + LAG_MARGIN;
    const train = pairs.filter((p) => p.at < from || p.at > to);
    if (train.length < MIN_PAIRS) return null;
    const mean = train.reduce((s, p) => s + p.x, 0) / train.length;
    const fit = robustPolynomial(train.map((p) => ({ x: p.x - mean, y: p.y })), 1);
    if (!fit) return null;
    for (const p of left) missed.push(p.y - evaluate(fit.c, p.x - mean));
  }
  return rms(missed);
}

// The lag the frequency follows the temperature by: of those the range
// is long enough for, the one whose line best predicts readings left
// out of its fit, each judged on the same pairs, those past the
// longest's settling.  `pairsWith(values)` pairs a temperature with the
// frequency.  The lag, its pairs past its own settling, and what it and
// none miss by.
function bestLag(at, values, pairsWith) {
  const span = at[at.length - 1] - at[0];
  const tried = LAGS.filter((lag) => lag * LAG_SPAN <= span);
  const start = at[0];
  const settledBy = (lag) => (p) => p.at >= start + LAG_SETTLE * lag;
  const longest = tried[tried.length - 1];
  const scored = tried.map((lag) => {
    const pairs = pairsWith(lagged(at, values, lag));
    const missed = heldOut(pairs.filter(settledBy(longest)));
    return missed == null ? null : { lag, pairs: pairs.filter(settledBy(lag)), missed };
  }).filter(Boolean);
  const none = scored.find((s) => s.lag === 0);
  if (!none) return null;
  const best = scored.reduce((b, s) => (s.missed < b.missed ? s : b), none);
  return { ...best, unlagged: none.missed };
}

// The lag the last scatter was fitted with, in seconds, and what it
// and none missed readings left out by; and its readings, drawn again
// when the lag is turned on or off.
let lagFitted = 0;
let lagChosen = null;
let scatterFrom = null;

// A lag as the page says it.
const lagText = (lag) => (lag < 3600 ? `${lag / 60} min` : `${lag / 3600} h`);

// The robust fits, linear and quadratic, of the frequency against the
// temperature over `pairs`, from T0, their mean temperature: each its
// name, color, coefficients (constant first, x from T0), and the RMS it
// leaves; and the frequency's own spread about its mean.  What the
// scatter draws and the dialog gives.
const FITS = [
  { name: "Linear", degree: 1, color: FIT_COLOR },
  { name: "Quadratic", degree: 2, color: CURVE_COLOR },
];
function fitsOf(pairs) {
  const t0 = Math.round(pairs.reduce((s, p) => s + p.x, 0) / pairs.length);
  const from = pairs.map((p) => ({ x: p.x - t0, y: p.y }));
  const mean = from.reduce((s, p) => s + p.y, 0) / from.length;
  const spread = rms(from.map((p) => p.y - mean));
  const fits = FITS.flatMap((f) => {
    const c = robustPolynomial(from, f.degree)?.c;
    if (!c) return [];
    const value = (x) => evaluate(c, x - t0);
    const left = rms(pairs.map(({ x, y }) => y - value(x)));
    // R^2, the share of the frequency's variance the fit accounts for.
    const determined = spread > 0 ? 1 - (left / spread) ** 2 : null;
    return [{ ...f, c, value, left, determined }];
  });
  return { pairs, t0, spread, fits };
}

// The tempcomp lines that cancel the frequency's following the
// temperature, from the last scatter's fits, each with what it leaves of
// the frequency's spread.  The frequency is how fast the clock runs,
// positive fast, and a positive compensation runs it faster, so each
// coefficient is the fitted one negated; T0 has none, so k0 is 0.
function drawFits() {
  if (!fitFrom) return;
  const { pairs, t0, spread, fits } = fitFrom;
  const sensor = lastStatus?.tempcomp;
  if (!sensor) return;
  const head = `tempcomp ${sensor.sensor} ${sensor.interval}`;
  const times = pairs.map((p) => p.at);
  // One block to paste: what both were fitted from, the sensor too, so
  // the file says it later, then each fit, its quality in a comment
  // above it, in ASCII, as chrony.conf is.
  const groups = fits.map(({ name, degree, c, left, determined }) => {
    const [k1, k2] = [-c[1], degree === 2 ? -c[2] : 0];
    // R, R^2's root: for the line, |r|.
    const most = Math.max(...pairs.map(({ x }) => Math.abs(k1 * (x - t0) + k2 * (x - t0) ** 2)));
    return [
      `# ${name} fit: leaves ${ppm(left)} RMS of the frequency's ${ppm(spread)}` +
        (determined == null
          ? "."
          : `, R ${Math.sqrt(Math.max(determined, 0)).toFixed(4)}, R^2 ${determined.toFixed(4)}.`),
      ...(most > TEMPCOMP_LIMIT
        ? [`# Compensates up to ${ppm(most)}, past chronyd's ${TEMPCOMP_LIMIT} ppm: readings past it are ignored.`]
        : []),
      `${head} ${t0} 0 ${coefficient(k1)} ${coefficient(k2)}`,
    ].join("\n");
  });
  const common = [
    `# Fitted by chronymon from ${pairs.length} points, ` +
      `${utcMinute(Math.min(...times))} to ${utcMinute(Math.max(...times))} UTC,`,
    `# of ${sensor.sensor}, robust (Huber) least squares` +
      (lagFitted > 0 ? `, the temperature lagged ${lagText(lagFitted)}.` : "."),
    ...(lagFitted > 0
      ? [`# The lag predicts readings left out of the fit to ${ppm(lagChosen.missed)} RMS, ` +
          `against ${ppm(lagChosen.unlagged)} with none.`,
        `# chronyd compensates each reading as it is: these lines suit a sensor file filtered by the same lag.`]
      : []),
  ].join("\n");
  // What was fitted, as text, its comment marks the copy's alone; then
  // each fit, the block to paste, its Copy in its corner, which copies
  // it with the comment.
  fitCopies = groups.map((group) => `${common}\n\n${group}`);
  const said = common.split("\n").map((line) => line.replace(/^# /, "")).join("\n");
  showHtml($("fits"), `<pre class="fitted">${esc(said)}</pre>` +
    groups.map((group, n) => `<div class="fit"><pre class="tempcomp">${esc(group)}</pre>` +
      `<button type="button" data-copy="${n}">Copy</button></div>`).join(""));
}

// What each fit's Copy copies.
let fitCopies = [];

// The frequency as one series: the protocol's, or the log's where the
// daemon was not recording.
function frequencyValues(got) {
  const reported = got.plots.find((p) => p.table === "tracking");
  const logged = got.plots.find((p) => p.table === "log_tracking");
  return reported.mean.map((v, i) => v ?? logged?.mean[i] ?? null);
}

function drawScatter(temperature, frequency, points) {
  scatterFrom = { temperature, frequency, points };
  scatterChart?.destroy();
  scatterChart = null;
  $("scatter").innerHTML = "";
  // The clock's own frequency: chronyd reports what is left after
  // tempcomp's compensation, so it is added back.
  const compensation = temperature.plots.find((p) => p.column === "compensation").mean;
  const frequencies = frequencyValues(frequency);
  const pairsWith = (values) => pairsOn(
    { read: temperature, values },
    { read: frequency, values: frequencies },
    points,
  ).flatMap((p) => (compensation[p.index] == null ? [] : [{ ...p, y: p.y - compensation[p.index] }]));
  // Fitted only since the sensor last changed: readings before are
  // another sensor's.
  const since = lastStatus?.tempcomp?.since ?? null;
  const read = temperature.plots[0].mean;
  const sinceAt = since == null ? 0 : temperature.at.findIndex((t) => t >= since);
  const best = $("lag").checked && sinceAt >= 0
    ? bestLag(temperature.at.slice(sinceAt), read.slice(sinceAt),
      (values) => pairsWith([...new Array(sinceAt).fill(null), ...values]))
    : null;
  lagFitted = best?.lag ?? 0;
  lagChosen = best;
  const pairs = best ? best.pairs : pairsWith(read);
  fitFrom = null;
  $("fit").hidden = true;
  if (pairs.length < MIN_PAIRS) {
    showHtml($("figures"), "too few readings of both in this range to set against each other");
    return;
  }
  const fitted = since == null ? pairs : pairs.filter((p) => p.at >= since);
  fitFrom = fitted.length >= MIN_PAIRS ? fitsOf(fitted) : null;
  scatterChart = scatter(
    $("scatter"),
    pairs,
    { name: columnName(key(TEMPCOMP, "temperature")) + (lagFitted > 0 ? `, lagged ${lagText(lagFitted)}` : "") },
    { name: OWN_FREQUENCY },
    $("scatter").clientWidth || 800,
    fitFrom?.fits ?? [],
  );
  // Only for a tempcomp line chronymond read, which the fit replaces.
  $("fit").hidden = !lastStatus?.tempcomp || !fitFrom;
  // Each fit on its own line, its name in its color, the scatter's
  // legend, with its R and R^2, the line's slope too, and since when,
  // if not the whole range.
  const named = (fitFrom?.fits ?? []).map((f) => {
    const figures = [
      ...(f.degree === 1 ? [`${f.c[1].toPrecision(3)} ppm per unit of temperature`] : []),
      ...(f.determined == null
        ? []
        : [`R ${Math.sqrt(Math.max(f.determined, 0)).toFixed(3)}`, `R² ${f.determined.toFixed(3)}`]),
    ];
    return `<span style="color:${f.color}">${f.name}</span>: ${figures.join(", ")}`;
  });
  const sinceChange = since != null && fitted.length < pairs.length
    ? ` since the sensor changed, ${local(since)}`
    : "";
  showHtml($("figures"),
    `${pairs.length.toLocaleString()} buckets` +
    (named.length ? `, robust least squares${sinceChange}:<br>${named.join("<br>")}` : "") +
    (best
      ? "<br>" + (lagFitted > 0
        ? `The temperature lagged ${lagText(lagFitted)}: readings left out of the fit missed by ` +
          `${ppm(best.missed)} RMS, against ${ppm(best.unlagged)} with none.`
        : `No lag: none predicts readings left out of the fit best, missing them by ${ppm(best.unlagged)} RMS.`)
      : ""));
}

async function load(signal) {
  // The status says which tempcomp line the fit replaces; read here if
  // the strip has not yet.
  lastStatus ??= await ask("/api/status", signal);
  // Whether there are any at all, from the table's extent.
  const probe = await ask(`/api/history?table=${TEMPCOMP}&columns=temperature&points=16`, signal);
  if (probe.first == null) {
    clearStack(stack, NOTHING);
    scatterChart?.destroy();
    scatterChart = null;
    $("scatter").innerHTML = "";
    showHtml($("figures"), "");
    return;
  }
  if (!haveUplot) {
    clearStack(stack, NO_UPLOT);
    return;
  }
  const { from, to } = rangeBounds();
  const events = await eventsFor(signal, from, to);
  stack.marks = events.marks;
  const temperature = await readHistory(signal, TEMPCOMP, ["temperature", "compensation"]);
  // On the temperature's grid, so the two pair by bucket.
  const frequency = await readHistory(signal, FREQUENCY.table, FREQUENCY.columns, null, FREQUENCY.fill,
    boundsOf(temperature));
  const drawn = [
    ...chartsOf(TEMPCOMP, temperature.plots).map((d) => ({ ...d, x: temperature.at })),
    ...filledCharts("tracking", frequency, { frequency: "frequency" }).map((d) => ({ ...d, x: frequency.at })),
  ];
  drawStack(stack, { x: [], span: spanOf([temperature, frequency]), drawn }, "no temperature readings in this range");
  drawScatter(temperature, frequency, pointsFor(temperature.to - temperature.from));
}

// How long Copy says it copied, in ms.
const COPIED_FOR = 1500;

// The lag kept in the address, and the scatter drawn again when it is
// turned on or off.
$("lag").checked = new URLSearchParams(location.search).has("lag");
$("lag").addEventListener("change", () => {
  remember({ lag: $("lag").checked ? "" : null });
  if (scatterFrom) drawScatter(scatterFrom.temperature, scatterFrom.frequency, scatterFrom.points);
});

$("fit").addEventListener("click", () => {
  drawFits();
  $("fit-dialog").showModal();
});
$("fit-close").addEventListener("click", () => $("fit-dialog").close());
// A click on the backdrop, outside the dialog's box, closes it: one
// begun outside too, so a selection dragged out of the box does not.
const outsideFit = (e) => {
  const box = $("fit-dialog").getBoundingClientRect();
  return e.clientX < box.left || e.clientX > box.right || e.clientY < box.top || e.clientY > box.bottom;
};
let pressedOutside = false;
$("fit-dialog").addEventListener("pointerdown", (e) => { pressedOutside = outsideFit(e); });
$("fit-dialog").addEventListener("click", (e) => {
  if (pressedOutside && outsideFit(e)) $("fit-dialog").close();
});
// Copied by the clipboard, there only to a page served over HTTPS or
// from localhost; else by the browser's copy command, from the text put
// in a hidden box and selected, which works over plain HTTP from a
// click; else the fit's block is left selected, to copy by hand.  The
// button says which.
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const box = document.createElement("textarea");
    box.value = text;
    box.setAttribute("readonly", "");
    box.style.cssText = "position: fixed; top: 0; left: 0; opacity: 0";
    $("fit-dialog").append(box);
    box.select();
    const copied = document.execCommand("copy");
    box.remove();
    return copied;
  }
}

$("fits").addEventListener("click", async (e) => {
  const button = e.target.closest("button[data-copy]");
  if (!button) return;
  const copied = await copyText(fitCopies[Number(button.dataset.copy)]);
  if (!copied) getSelection().selectAllChildren(button.previousElementSibling);
  button.textContent = copied ? "Copied" : "Select and copy";
  setTimeout(() => { button.textContent = "Copy"; }, COPIED_FOR);
});
rangeControl($("ranges"), soon);
addEventListener("resize", soon);
content({
  floor: 30,
  clear(why) {
    clearStack(stack, why);
    scatterChart?.destroy();
    scatterChart = null;
    $("scatter").innerHTML = "";
    showHtml($("figures"), "");
  },
  load,
});
</script>
