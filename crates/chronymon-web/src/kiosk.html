<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>chronymon: kiosk</title>

<!-- Nothing here waits on the network before the first paint, which a
     player that reloads the page would otherwise show as a white
     screen: the server inlines style.css, common.js and charts.js
     into this page, and uPlot's stylesheet, which only the charts need
     and which they are drawn well after, is applied once it arrives. -->
<link rel="stylesheet" media="print" onload="this.media = 'all'"
      href="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.min.css"
      integrity="sha384-IfV0B7MIOYuO95kO9G5ySKPz/85zqFNOAs8iy4tkK5zd9izhJAB8b7lHrwYqqmYE"
      crossorigin="anonymous">

<link rel="stylesheet" href="/style.css">

<body class="kiosk">

<section id="kiosk-state">
  <div id="kiosk-head"><span class="muted">connecting...</span></div>
  <div class="panel" id="kiosk-sync">
    <div class="mode" id="kiosk-mode"></div>
    <div id="kiosk-troubles"></div>
    <div class="clock" id="kiosk-clock"><span id="kiosk-time">--:--:--</span> <span class="muted">UTC</span>
      <span class="age" id="kiosk-age" hidden></span></div>
    <div class="muted" id="kiosk-date"></div>
    <div class="reference"><span id="kiosk-reference">--</span> <span class="muted" id="kiosk-stratum"></span></div>
    <div class="muted" id="kiosk-update"></div>
  </div>
  <div class="panel" id="kiosk-tiles"></div>
  <div class="panel" id="kiosk-sources">
    <h2>Sources</h2>
    <div id="kiosk-source-rows"></div>
    <!-- A hidden copy of the list, laid out whole to see how much fits,
         as each list here has.  Hidden here rather than in style.css,
         so it never paints even before or without the stylesheet. -->
    <div class="measure" aria-hidden="true"
         style="position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
                padding: inherit; visibility: hidden; pointer-events: none"></div>
  </div>
  <div id="kiosk-foot" class="muted" hidden></div>
</section>

<section id="kiosk-history">
  <div class="panel" id="kiosk-stack">
    <div id="charts"></div>
    <div id="note"></div>
  </div>
  <div class="panel" id="kiosk-events">
    <h2>What happened</h2>
    <div id="kiosk-event-rows"></div>
    <div class="measure" aria-hidden="true"
         style="position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box;
                padding: inherit; visibility: hidden; pointer-events: none"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"
        integrity="sha384-Gx3t0zdBAuQOuvvmaLZj7HKEiSgWTAs+VdtNY7wt19QDPTDQjFIwAuXDj0zeN00c"
        crossorigin="anonymous"></script>
<script src="/common.js"></script>
<script src="/charts.js"></script>
<script>
"use strict";

// One page for an unattended display: the clock's state at a glance,
// nothing to click, no scrolling.  chronyd's state and the host's time
// in large type on the left, from the status row the strip polls every
// second, and its sources; on the right the clock's offset, frequency
// and skew and every source's offset, over one range (a day unless
// `?last=` says otherwise), and what happened lately.

addressFixed = true;

const view = new URLSearchParams(location.search);

// The margin a display that overscans hides at its edges, from
// `?inset=`: one length for every edge, or two, the sides' then the
// top and bottom's.  A bare number is a percent of the screen's width
// (the sides) or height (top and bottom), as overscan is given; a
// number with `px` is pixels.  Anything else is ignored.
const INSET = /^(\d+(?:\.\d+)?)(px)?$/;
const INSET_MOST = 25;
function inset() {
  const asked = view.get("inset");
  if (!asked) return;
  const parts = asked.split(",").map((x) => x.trim().match(INSET));
  if (!parts.length || parts.length > 2 || parts.some((m) => !m)) return;
  const [sides, ends = sides] = parts;
  const length = (m, unit) => m[2] ? `${m[1]}px` : `${Math.min(Number(m[1]), INSET_MOST)}${unit}`;
  document.body.style.setProperty("--inset-x", length(sides, "vw"));
  document.body.style.setProperty("--inset-y", length(ends, "vh"));
}
inset();

// One of the stylesheet's kiosk pixels in CSS pixels, as `--u`: 1 at
// full size, less on a smaller page.  `scale` sets it.
let unitPx = 1;

// With `?debug`, the foot shows how many times this browser has loaded
// it so, how this load came about (navigate, reload), how long it has
// been up, the browser's Chrome version, the viewport, and the last
// error the page did not catch: a display that flashes now and then
// may be its player reloading the page, which this tells apart from
// the page redrawing itself, and a display has no console to read.
const DEBUG = view.has("debug");
const loadedHow = performance.getEntriesByType?.("navigation")[0]?.type ?? "?";
const chromeVersion = navigator.userAgent.match(/Chrome\/(\d+)/)?.[1] ?? "?";
const loadedAt = Date.now();
let lastError = null;
const LOADS_KEY = "kiosk:loads";
function countLoad() {
  try {
    const n = Number(localStorage.getItem(LOADS_KEY) ?? 0) + 1;
    localStorage.setItem(LOADS_KEY, String(n));
    return n;
  } catch (e) {
    return "?";
  }
}
const loadCount = DEBUG ? countLoad() : null;

// Write the foot, with `?debug`.  Called with each status, and at once
// on an error: one that stops the status being painted would otherwise
// never be shown.
function showLoads() {
  if (!DEBUG) return;
  update($("kiosk-foot"), "textContent",
    `load ${loadCount} (${loadedHow}), up ${age((Date.now() - loadedAt) / 1000)}, Chrome ${chromeVersion}, ` +
    `${innerWidth}x${innerHeight} at ${devicePixelRatio}x, scale ${unitPx.toFixed(3)}` +
    (lastError ? `, error: ${lastError}` : ""));
}
function caught(message) {
  lastError = message;
  showLoads();
}
if (DEBUG) {
  $("kiosk-foot").hidden = false;
  addEventListener("error", (e) => caught(e.message));
  addEventListener("unhandledrejection", (e) => caught(String(e.reason?.message ?? e.reason)));
}

// How old the server's last answer may be, in seconds, before the
// clock stops counting on from it and says how old it is.
const CLOCK_TRUSTED_FOR = 3;
// The host's clock at the server's last answer, `/api/status`'s `now`,
// in seconds since the epoch; when this page saw that answer, in ms by
// its own monotonic clock; and whether the feed was live.  Null before
// the first.
let clockFrom = null;
let clockTimer = null;
// The display's time zone's name, as "PDT", for its local time.
const ZONE = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" });
const zoneName = (d) => ZONE.formatToParts(d).find((p) => p.type === "timeZoneName")?.value ?? "";

const isoDate = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const clockTime = (h, m, s) => `${pad(h)}:${pad(m)}:${pad(s)}`;

// The host's time in UTC, counted on from the server's last answer by
// the display's own clock, redrawn as each second begins, so it moves
// evenly between polls rather than in whatever steps they arrive in.
// Counted on only while answers keep coming: past that the last time
// is shown as it was, with its age, rather than a confident time the
// page made up.  Dimmed, too, while the feed is not live: the host's
// clock, but not one chronyd is known to be keeping.  Below it the
// UTC date, and the display's local time, with its date when that
// differs.
function drawClock() {
  clearTimeout(clockTimer);
  const since = clockFrom ? (performance.now() - clockFrom.at) / 1000 : 0;
  const counting = !clockFrom || since <= CLOCK_TRUSTED_FOR;
  const t = clockFrom ? clockFrom.now + (counting ? since : 0) : null;
  const d = t === null ? null : new Date(Math.floor(t) * 1000);
  update($("kiosk-time"), "textContent", d
    ? clockTime(d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()) : "--:--:--");
  let date = "";
  if (d) {
    const utc = isoDate(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    const local = isoDate(d.getFullYear(), d.getMonth(), d.getDate());
    date = d.getTimezoneOffset() === 0 ? utc
      : `${utc} · ${clockTime(d.getHours(), d.getMinutes(), d.getSeconds())} ${zoneName(d)}` +
        (local === utc ? "" : ` ${local}`);
  }
  update($("kiosk-date"), "textContent", date);
  update($("kiosk-age"), "textContent", counting ? "" : `as of ${age(since)} ago`);
  update($("kiosk-age"), "hidden", counting);
  $("kiosk-clock").classList.toggle("dim", !counting || !clockFrom?.live);
  // At the next second of the time shown, or in a second, for the age.
  clockTimer = setTimeout(drawClock, counting && t !== null ? (1 - (t % 1)) * 1000 : 1000);
}

// Where the last status, sources and events are kept, so a reload
// paints them before the first poll answers.  Storage may be refused
// or full; the page works without it.
const LAST_KEY = "kiosk:last";
function keep(part, value) {
  try {
    const kept = JSON.parse(localStorage.getItem(LAST_KEY)) ?? {};
    kept[part] = { value, at: Date.now() };
    localStorage.setItem(LAST_KEY, JSON.stringify(kept));
  } catch (e) {
    // Not kept: a reload paints once read again.
  }
}
function kept() {
  try {
    return JSON.parse(localStorage.getItem(LAST_KEY)) ?? {};
  } catch (e) {
    return {};
  }
}

// The least room, in CSS pixels inside the inset, the kiosk is drawn
// full size in.  On less it is scaled down to fit: a player's display
// zoom can leave a 1920x1080 screen a 1280x720 page.
const FULL_SIZE = { width: 1440, height: 1080 };
// The stylesheet's own padding at each edge, in kiosk pixels.
const EDGE = 12;
// Set `--u` for the room the page has now.  Answers whether it changed.
function scale() {
  const style = getComputedStyle(document.body);
  const padding = (a, b) => parseFloat(style[a]) + parseFloat(style[b]);
  // The inset alone: the padding less the stylesheet's own.
  const room = {
    width: innerWidth - padding("paddingLeft", "paddingRight") + 2 * EDGE * unitPx,
    height: innerHeight - padding("paddingTop", "paddingBottom") + 2 * EDGE * unitPx,
  };
  const next = Math.min(1, room.width / FULL_SIZE.width, room.height / FULL_SIZE.height);
  if (next === unitPx) return false;
  unitPx = next;
  document.body.style.setProperty("--u", `${next}px`);
  return true;
}

// The strip's readings shown as tiles, by name, in order.
const KIOSK_TILES = [
  "last offset", "RMS offset", "frequency", "skew",
  "root delay", "root dispersion", "residual freq", "leap",
];
// The clock's charts, as the live page draws them, with chronyd's log
// where the daemon has no rows; then every source's offset.
const KIOSK_COLUMNS = ["last_offset", "frequency", "skew"];
const KIOSK_FILLS = { last_offset: "offset", frequency: "frequency", skew: "skew" };
const KIOSK_OVERLAY = ["source_sample", "latest_measurement"];
// The most events read for the list, the newest whatever the range; it
// shows as many as fit.
const KIOSK_EVENTS = 20;

// Each chart title's height in kiosk pixels, as style.css sets it,
// taken from the room each chart is given.
const TITLE_HEIGHT = 30;
// The least a chart is drawn at, however little room there is, in
// kiosk pixels.
const SHORTEST_CHART = 60;
// The axes' type in kiosk pixels, larger than the other pages', to be
// read from further away; and uPlot's own, which the axes' room is
// sized for.
const KIOSK_TYPE = 17;
const UPLOT_TYPE = 12;
// The range shown unless `?last=` says otherwise, in seconds: a day,
// one turn of the room's temperature, as smartclock's kiosk shows.
const KIOSK_RANGE = 86400;
// The shortest refresh, in seconds: the status is polled every second
// regardless; the charts, sources and events are read at this.
const KIOSK_FLOOR = 30;

const stack = {
  container: "charts",
  readout: null,
  note: "note",
  sync: haveUplot ? uPlot.sync("kiosk") : null,
  charts: [],
  marks: [],
  // Each y axis fitted to the bulk of what it draws: nobody zooms past
  // a restart's or a boot's transients here.  The browser pages keep
  // the whole range, for finding them.
  clip: true,
  // Each chart's height, so the stack, with the time axis under its
  // bottom chart, fills its panel and no more.
  height(count) {
    const room = ($("charts").clientHeight - (TIME_SIZE - STACK_END) * stack.scale) / unitPx;
    return Math.max(SHORTEST_CHART, Math.floor(room / Math.max(1, count)) - TITLE_HEIGHT) * unitPx;
  },
};

// Set the stack's type for the scale the page is drawn at.  uPlot reads
// a font's size as the whole pixels before "px".
function stackType() {
  const px = Math.round(KIOSK_TYPE * unitPx);
  stack.font = `${px}px system-ui, sans-serif`;
  stack.scale = px / UPLOT_TYPE;
}

// A tile: a reading `v` in large type over what it is, `k`.  `tone` is
// "", "warn" or "bad".
const tile = (k, v, tone = "") => ({ k, v: String(v), tone });

// The tiles, kept and their text changed in place, so a reading that
// changes repaints only itself.  Drawn afresh only when which tiles
// there are changes.
function showTiles(list) {
  const el = $("kiosk-tiles");
  const which = list.map((t) => t.k).join("\n");
  if (el.dataset.which !== which) {
    el.dataset.which = which;
    el.innerHTML = list.map((t) =>
      `<div class="tile"><span class="v"></span><span class="k">${esc(t.k)}</span></div>`,
    ).join("");
  }
  list.forEach((t, n) => {
    const shown = el.children[n];
    update(shown, "className", `tile ${t.tone}`);
    update(shown.children[0], "textContent", t.v);
  });
}

// The leap status's tone: a second to come is worth noticing, and an
// unsynchronized clock is wrong.
const LEAP_TONES = { insert: "warn", delete: "warn", unsynchronized: "bad" };

// Whether chronyd is synchronized to something other than its own
// refclocks, as the sources last read say: a refclock is there, and
// not the one selected.  A refclock another is locked to, an NMEA a
// PPS numbers its pulses by, is the PPS's partner rather than a clock
// of its own.
function onBackups() {
  const own = current(sources).filter((s) => s.mode === "refclock" && !paired(s));
  return own.length > 0 && !own.some((s) => s.state === "selected");
}

// Whether the clock is synchronized, in a word, and how it should be
// read: the feed's own state when that is not live.
function syncOf(s) {
  const [state, words] = feedState(s);
  if (state !== "live") return [words.toLowerCase(), state === "stale" ? "warn" : "bad"];
  if (!s.tracking) return ["no update yet", "warn"];
  if (s.tracking.leap === "unsynchronized") return ["unsynchronized", "bad"];
  if (coasting(s)) return ["coasting", "warn"];
  if (onBackups()) return ["on backups", "warn"];
  return ["synchronized", ""];
}

// What is wrong now, a line each under the clock's state, the panel
// edged in the worst one's color, or in amber `edged` alone: coasting
// or on backups.
function drawTroubles(s, edged = false) {
  const troubles = troublesOf(s);
  showHtml($("kiosk-troubles"), troubles.map((t) =>
    `<div class="trouble ${t.tone}"${t.hint ? ` title="${esc(t.hint)}"` : ""}>${esc(t.words)}` +
    `${t.owner ? ` <span class="owner">${esc(t.owner)}</span>` : ""}</div>`).join(""));
  update($("kiosk-sync"), "className", `panel ${troubles[0]?.tone ?? (edged ? "warn" : "")}`.trim());
}

// Paint a status; `cached` for the one kept by the last load, shown as
// last seen until the first poll answers.
// `cachedAge` for the one kept by the last load, how long ago it was
// kept, in seconds.
function renderKiosk(s, cached = false, cachedAge = 0) {
  if (!cached) keep("status", s);
  showLoads();
  const [state, words] = cached ? ["stale", "LAST SEEN"] : feedState(s);
  clockFrom = s.now == null ? null
    : { now: s.now - cachedAge, at: performance.now() - cachedAge * 1000, live: state === "live" };
  drawClock();
  showHtml($("kiosk-head"),
    `<span class="dot ${state}"></span><span>${esc(s.host ? `chronyd@${s.host}` : "chronyd")}</span>` +
    (state === "live" ? "" : `<span class="pill ${state}">${esc(words)}</span>`) +
    (s.status ? `<span class="muted">polled ${esc(age(s.status.age))} ago</span>` : ""));
  const [sync, tone] = syncOf(s);
  update($("kiosk-mode"), "textContent", sync);
  update($("kiosk-mode"), "className", `mode ${tone}`);
  drawTroubles(s, sync === "coasting" || sync === "on backups");
  const r = Object.fromEntries(readings(s).map((x) => [x.k, x]));
  update($("kiosk-reference"), "textContent", r.reference?.v ?? "--");
  update($("kiosk-stratum"), "textContent", r.stratum ? `stratum ${r.stratum.v}` : "");
  // The count last, so that its width changing moves nothing after it.
  update($("kiosk-update"), "textContent", r["last update"]
    ? `updated every ${r["update interval"].v}, last ${r["last update"].v}`
    : s.status?.detail ?? "");
  showTiles(KIOSK_TILES.filter((k) => r[k]).map((k) =>
    tile(k, r[k].v, k === "leap" ? LEAP_TONES[s.tracking.leap] ?? "" : "")));
  stale(state !== "live");
}

function lostKiosk(what, why) {
  showLoads();
  showHtml($("kiosk-head"), `<span class="dot down"></span><span class="pill down">${esc(what)}</span>`);
  update($("kiosk-mode"), "textContent", what);
  update($("kiosk-mode"), "className", "mode bad");
  drawTroubles({});
  update($("kiosk-update"), "textContent", why ?? "");
  if (clockFrom) clockFrom.live = false;
  drawClock();
  stale(true);
}

// The tiles and sources dimmed, while what they say is the last seen
// rather than current: kept, so a poll that fails once does not blank
// them for a second.
function stale(dim) {
  for (const id of ["kiosk-tiles", "kiosk-sources"]) $(id).classList.toggle("dim", dim);
}

// How many rows of `html`, a list for `panel`, fit inside its padding:
// laid out whole in the panel's hidden copy, under a copy of its
// heading, so what is shown is written once, cut to fit rather than a
// fixed count that leaves the panel half empty or cut off.
function fitting(panel, html) {
  const measure = panel.querySelector(".measure");
  showHtml(measure, panel.querySelector("h2").outerHTML + html);
  const room = panel.getBoundingClientRect().top + panel.clientTop + panel.clientHeight -
    parseFloat(getComputedStyle(panel).paddingBottom);
  return [...measure.querySelectorAll("tr")].filter((row) => row.getBoundingClientRect().bottom <= room).length;
}

// The sources last read.  Those removed are for the Sources page, not
// a summary.
let sources = [];
const current = (list) => list.filter((s) => !s.removed);

// The first `n` of the current sources on a line each, as chronyd last
// reported them: chronyc's mark for its state, its name in its color on
// the charts, its reach, and its last offset; and, when that is not all
// of them, how many more there are.
function sourceRows(n) {
  const listed = current(sources);
  if (!listed.length) return `<span class="muted">no sources recorded</span>`;
  const more = listed.length - n;
  return `<table><tbody>${listed.slice(0, n).map((s) => {
    const [mark, cls] = SOURCE_STATES[s.state] ?? ["", ""];
    const report = s.report ?? {};
    return `<tr><td class="${cls}" title="${esc(s.state ?? "")}">${esc(mark)}</td>` +
      `<td style="color:${sourceColor(s.id)}">${esc(sourceName(s))}</td>` +
      `<td class="muted">${report.reachability == null ? "--" : report.reachability.toString(8)}</td>` +
      `<td>${esc(seconds(report.latest_measurement, true))}</td></tr>`;
  }).join("")}${more > 0 ? `<tr><td></td><td class="muted" colspan="3">and ${more} more</td></tr>` : ""}` +
    `</tbody></table>`;
}

// As many sources as fit: all of them, or a row fewer than fit and a
// row saying how many more.
function drawSources() {
  const all = current(sources).length;
  const fit = fitting($("kiosk-sources"), sourceRows(all));
  showHtml($("kiosk-source-rows"), sourceRows(fit >= all ? all : Math.max(0, fit - 1)));
}

// The events last read, newest first.
let events = [];

// As many of the events as fit, newest first, each with its source and
// its detail.
function drawEvents() {
  const drawn = (n) => events.length
    ? `<table><tbody>${events.slice(0, n).map((e) =>
        `<tr><td>${esc(shortTime(e.at))}</td>` +
        `<td><span style="color:${eventColor(e.kind)}">${esc(eventWords(e.kind))}</span>` +
        `${e.source ? ` ${esc(e.source)}` : ""}` +
        `${eventDetail(e) ? ` <span class="muted">${esc(eventDetail(e))}</span>` : ""}</td></tr>`).join("")}</tbody></table>`
    : `<span class="muted">nothing recorded</span>`;
  showHtml($("kiosk-event-rows"), drawn(fitting($("kiosk-events"), drawn(events.length))));
}

// A refclock another is locked to, as an NMEA receiver's time of day
// numbers a PPS's pulses: beside the PPS its offsets, tens of
// milliseconds off, are noise that would set the axis.  Left out of
// the offset overlay; one no PPS is locked to is a source like any
// other, and charted, `noselect` or not.
const paired = (s) => Boolean(s.locked_by);

// What the offset overlay's title says it leaves out: each paired
// refclock, and the one locked to it.
const leftOut = (list) => list.filter(paired)
  .map((s) => `, ${sourceName(s)} left out, ${s.locked_by} locked to it`).join("");

async function load(signal) {
  const { from, to } = rangeBounds();
  const [listed, marked, latest] = await Promise.all([
    ask("/api/sources", signal),
    eventsFor(signal, from, to),
    ask(`/api/events?limit=${KIOSK_EVENTS}`, signal),
  ]);
  sources = listed;
  drawSources();
  events = [...latest].reverse();
  drawEvents();
  keep("sources", listed);
  keep("events", events);
  stack.marks = marked.marks;
  if (!haveUplot) {
    clearStack(stack, NO_UPLOT);
    return;
  }
  const fill = { table: "log_tracking", columns: KIOSK_COLUMNS.map((c) => KIOSK_FILLS[c]) };
  const clock = await readHistory(signal, "tracking", KIOSK_COLUMNS, null, fill);
  const overlay = await ask(overlayQuery(KIOSK_OVERLAY, boundsOf(clock)), signal, HISTORY_TIMEOUT);
  // The overlay's lines are the sources listed, less paired ones, and
  // the list, colored alike, is its legend: eight names or more in its
  // title would wrap onto the chart.
  const charted = new Set(current(sources).filter((s) => !paired(s)).map((s) => s.id));
  const names = new Map(sources.map((s) => [s.id, sourceName(s)]));
  const offsets = overlayChart(...KIOSK_OVERLAY,
    { ...overlay, lines: overlay.lines.filter((l) => charted.has(l.source_id)) },
    (id) => names.get(id) ?? `source ${id}`);
  offsets.heading = esc(offsets.title) + `<span class="muted">: each source in its color` +
    esc(leftOut(current(sources))) + "</span>";
  // Not chronyd's clock: its sources' offsets go on while it is not
  // synchronized to one.
  offsets.shaded = false;
  const drawn = [...filledCharts("tracking", clock, KIOSK_FILLS), offsets];
  const span = spanOf([clock, overlay]);
  const bands = [...notSynchronizedBands(clock), ...journalBands(marked.events, span.from, span.to, troublesNow())];
  drawStack(stack, { x: clock.at, span, drawn, bands }, "no clock updates in this range");

}

// Paint what the last load kept, before anything is read: a player
// that reloads the page then shows the last state, as last seen, not
// an empty screen.  The status's ages are counted on to now.
function paintKept() {
  const last = kept();
  const status = last.status?.value;
  if (status) {
    const since = (Date.now() - last.status.at) / 1000;
    renderKiosk({
      ...status,
      now: status.now + since,
      status: status.status && { ...status.status, age: status.status.age + since },
    }, true, since);
  }
  if (last.sources) {
    sources = last.sources.value;
    drawSources();
  }
  if (last.events) {
    events = last.events.value;
    drawEvents();
  }
}

// The window's size the page was last fitted to.
let fitted = null;

// Fit the page to its window again, once it has changed: at another
// scale the charts' type is another size, which uPlot takes only when
// a chart is made.
function fit() {
  const size = `${innerWidth}x${innerHeight}`;
  if (size === fitted) return;
  fitted = size;
  if (scale()) {
    stackType();
    clearStack(stack, "");
  }
  soon();
}

scale();
stackType();
fitted = `${innerWidth}x${innerHeight}`;
readRange(KIOSK_RANGE);
new ResizeObserver(fit).observe(document.body);
// Each list's room changes with the panels beside it, as well as the
// window's.
new ResizeObserver(drawSources).observe($("kiosk-sources"));
new ResizeObserver(drawEvents).observe($("kiosk-events"));
drawClock();
paintKept();
content({
  floor: KIOSK_FLOOR,
  render: renderKiosk,
  lost: lostKiosk,
  clear(why) {
    clearStack(stack, why);
    events = [];
    sources = [];
    showHtml($("kiosk-source-rows"), "");
    showHtml($("kiosk-event-rows"), `<span class="muted">${esc(why)}</span>`);
  },
  load,
});
</script>
