[package]
name = "chronymon-web"
description = "A browser view of chronymon's database: chronyd's tracking, sources and events, charted live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chronymon-http = { version = "1.2.1", path = "../chronymon-http" }
chronymon-log = { version = "1.2.1", path = "../chronymon-log" }
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
serde_json = "1.0.154"

[dev-dependencies]
chronymon = { path = "../chronymon" }
chronymon-control = { path = "../chronymon-control" }
