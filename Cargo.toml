# Do not add default-members: a bare `cargo test` covers every member
# only while it is absent.
[workspace]
members = [
    "crates/chronymon",
    "crates/chronymon-control",
    "crates/chronymon-http",
    "crates/chronymon-log",
    "crates/chronymon-web",
    "crates/chronymond",
]
resolver = "3"

[workspace.package]
version = "1.2.0-beta.2"
edition = "2024"
rust-version = "1.89"
authors = ["Christopher Hoover <ch@murgatroid.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/charlieh0tel/chronymon"

[profile.release]
strip = "symbols"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
doc_markdown = "warn"
enum_glob_use = "deny"
