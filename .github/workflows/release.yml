name: release

# The packages built on every push to main and every pull request to
# it, so a change that breaks packaging shows before a tag, and a tag
# reuses main's build cache; published only for a tag (rust-build-deb's
# release job, and trigger-apt-repo's if).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # The whole workspace built once per architecture, and chronymond's
  # [package.metadata.deb] packaged: the chronymon package, both
  # programs.  No toolchain input: rust-build-deb reads
  # rust-toolchain.toml.
  deb:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    permissions:
      contents: write
    with:
      packages: "chronymond"

  trigger-apt-repo:
    needs: deb
    # A pre-release, a tag with a hyphen (v1.2.0-beta.1), is on GitHub
    # only: apt-repo takes each repository's latest release, never one.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    steps:
      # workflow_dispatch, not repository_dispatch: the token then needs
      # Actions: write on apt-repo instead of Contents: write, which could
      # push a commit to the workflow that runs with the GPG signing key.
      - name: Trigger APT repo rebuild
        env:
          GH_TOKEN: ${{ secrets.APT_REPO_TOKEN }}
        run: gh workflow run update-repo.yml -R charlieh0tel/apt-repo
